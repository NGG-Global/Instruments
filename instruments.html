<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Aircraft Dials — Smartphone Panel</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#030405;
  font-family:Arial,Helvetica,sans-serif;
  overscroll-behavior:none;
}
body{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:10px;
}
.phone{
  width:min(94vw,430px);
  aspect-ratio:390/844;
  max-height:96vh;
  padding:12px 7px 9px;
  border:2px solid #2d3235;
  border-radius:36px;
  overflow:hidden;
  background:
    linear-gradient(180deg,#131719 0%,#080a0b 100%);
  box-shadow:
    0 30px 70px rgba(0,0,0,.72),
    inset 0 0 0 1px rgba(255,255,255,.035);
}
.topbar{
  height:16px;
  display:flex;
  justify-content:center;
  align-items:center;
  margin-bottom:4px;
}
.speaker{
  width:54px;
  height:5px;
  border-radius:10px;
  background:#252a2d;
  box-shadow:inset 0 1px 1px rgba(0,0,0,.85);
}
.panel{
  height:calc(100% - 20px);
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:40% 1fr 1fr;
  gap:5px;
}
.slot{
  min-width:0;
  min-height:0;
  position:relative;
  overflow:hidden;
  border-radius:7px;
  border:1px solid #202427;
  background:#070809;
  box-shadow:inset 0 0 12px rgba(0,0,0,.72);
}
.slot.attitude{grid-column:1/3}
.slot canvas{
  width:100%;
  height:100%;
  display:block;
}
.caption{
  position:absolute;
  z-index:5;
  left:5px;
  bottom:4px;
  color:rgba(238,239,235,.48);
  font-size:7px;
  line-height:1;
  letter-spacing:.65px;
  pointer-events:none;
  text-shadow:0 1px 2px #000;
}
.hidden-ui{
  position:absolute!important;
  width:1px!important;
  height:1px!important;
  overflow:hidden!important;
  clip-path:inset(50%)!important;
  white-space:nowrap!important;
  opacity:0!important;
  pointer-events:none!important;
}
.sensor-hint{
  position:absolute;
  z-index:20;
  right:8px;
  top:8px;
  font-size:7px;
  color:rgba(255,255,255,.32);
  pointer-events:none;
  letter-spacing:.4px;
}
@media(max-width:480px){
  body{padding:0}
  .phone{
    width:100vw;
    height:100dvh;
    max-height:none;
    aspect-ratio:auto;
    border:0;
    border-radius:0;
    padding:max(7px,env(safe-area-inset-top)) 5px max(7px,env(safe-area-inset-bottom));
  }
}
</style>
</head>
<body>
<div class="phone" id="phonePanel">
  <div class="topbar"><div class="speaker"></div></div>
  <div class="panel">
    <div class="slot attitude">
      <canvas id="attCanvas"></canvas>
      <div class="caption">ATTITUDE</div>
    </div>
    <div class="slot">
      <canvas id="headingCanvas"></canvas>
      <div class="caption">HEADING</div>
    </div>
    <div class="slot">
      <canvas id="altCanvas"></canvas>
      <div class="caption">ALTIMETER</div>
    </div>
    <div class="slot">
      <canvas id="vsiCanvas"></canvas>
      <div class="caption">VERTICAL SPEED</div>
    </div>
    <div class="slot">
      <canvas id="speedCanvas"></canvas>
      <div class="caption">GROUND SPEED</div>
    </div>
  </div>

  <!-- Required by the original standalone scripts, but kept off the instrument faces. -->
  <button id="headingPermBtn" class="hidden-ui">Enable compass</button>
  <div id="headingReadout" class="hidden-ui"></div>
  <button id="altGpsBtn" class="hidden-ui">Enable GPS altitude</button>
  <div id="altReadout" class="hidden-ui"></div>
  <div id="speedStatus" class="hidden-ui"></div>
</div>

<script>
(function(){

const canvas = document.getElementById('attCanvas');

const state = {
  pitch: 0,
  roll: 0,
  nativeActive: false
};

window.setAttitude = function(pitchDeg, rollDeg){
  if (Number.isFinite(pitchDeg)) state.pitch = pitchDeg;
  if (Number.isFinite(rollDeg)) state.roll = rollDeg;
  state.nativeActive = true;
};

// Offscreen texture for the ball
const texCanvas = document.createElement('canvas');
const TEX = 320;
texCanvas.width = TEX;
texCanvas.height = TEX;
const texCtx = texCanvas.getContext('2d');
const imgData = texCtx.createImageData(TEX, TEX);
const px = imgData.data;

function fitCanvas(c){
  const rect = c.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(rect.width * dpr));
  const h = Math.max(1, Math.round(rect.height * dpr));
  if (c.width !== w || c.height !== h){
    c.width = w; c.height = h;
  }
  return {ctx:c.getContext('2d'), w, h};
}

function roundedRect(ctx,x,y,w,h,r){
  r = Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawScrew(ctx, cx, cy, r){
  const g = ctx.createRadialGradient(cx-r*0.3, cy-r*0.35, r*0.08, cx, cy, r);
  g.addColorStop(0, '#8d9499');
  g.addColorStop(0.4, '#596066');
  g.addColorStop(1, '#202529');
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.fillStyle = g;
  ctx.fill();
  ctx.strokeStyle = '#11161b';
  ctx.lineWidth = r*0.16;
  ctx.stroke();
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(-0.65);
  ctx.strokeStyle = '#535b63';
  ctx.lineWidth = r*0.18;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-r*0.52,0);
  ctx.lineTo(r*0.52,0);
  ctx.stroke();
  ctx.restore();
}

function drawTrunnion(ctx, cx, cy, r){
  const g = ctx.createRadialGradient(cx-r*0.25, cy-r*0.25, r*0.12, cx, cy, r);
  g.addColorStop(0, '#6c747a');
  g.addColorStop(0.42, '#3c4348');
  g.addColorStop(1, '#161b1f');
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.fillStyle = g;
  ctx.fill();
  ctx.strokeStyle = '#0b0e10';
  ctx.lineWidth = r*0.18;
  ctx.stroke();
}

function drawBankScale(ctx, cx, cy, r, size){
  ctx.save();
  ctx.translate(cx, cy);

  // white bank ticks across the top arc
  ctx.strokeStyle = '#f3f5f6';
  ctx.lineWidth = size*0.0042;
  const marks = [-60,-45,-30,-20,-10,10,20,30,45,60];
  marks.forEach(d => {
    const a = d * Math.PI / 180;
    const major = Math.abs(d) === 30 || Math.abs(d) === 60;
    const inner = r * (major ? 0.84 : 0.88);
    const outer = r * 0.98;
    const x1 = Math.sin(a) * inner;
    const y1 = -Math.cos(a) * inner;
    const x2 = Math.sin(a) * outer;
    const y2 = -Math.cos(a) * outer;
    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);
    ctx.stroke();
  });

  // side white triangular markers
  [-45, -20, 20, 45].forEach((d) => {
    const a = d * Math.PI / 180;
    const rr = r * 0.93;
    const tx = Math.sin(a) * rr;
    const ty = -Math.cos(a) * rr;
    ctx.save();
    ctx.translate(tx, ty);
    ctx.rotate(a);
    ctx.fillStyle = '#f3f5f6';
    ctx.beginPath();
    ctx.moveTo(0, -size*0.010);
    ctx.lineTo(-size*0.012, size*0.010);
    ctx.lineTo(size*0.012, size*0.010);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  });

  // top white reference triangle
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.moveTo(0, -r*1.03);
  ctx.lineTo(-size*0.020, -r*0.90);
  ctx.lineTo(size*0.020, -r*0.90);
  ctx.closePath();
  ctx.fill();

  // inner orange cue triangle
  ctx.strokeStyle = '#f39a1e';
  ctx.lineWidth = size*0.006;
  ctx.beginPath();
  ctx.moveTo(0, -r*0.84);
  ctx.lineTo(-size*0.020, -r*0.78);
  ctx.lineTo(size*0.020, -r*0.78);
  ctx.closePath();
  ctx.stroke();

  ctx.restore();
}
function drawAircraftSymbol(ctx, cx, cy, size){
  ctx.save();

  // orange horizon reference bar
  ctx.strokeStyle = '#f39a1e';
  ctx.lineWidth = size*0.010;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - size*0.17, cy);
  ctx.lineTo(cx - size*0.042, cy);
  ctx.moveTo(cx + size*0.042, cy);
  ctx.lineTo(cx + size*0.17, cy);
  ctx.stroke();

  // dark center airplane / reference shape
  ctx.strokeStyle = '#1a1c1e';
  ctx.lineWidth = size*0.007;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - size*0.030, cy);
  ctx.lineTo(cx - size*0.012, cy);
  ctx.lineTo(cx, cy + size*0.010);
  ctx.lineTo(cx + size*0.012, cy);
  ctx.lineTo(cx + size*0.030, cy);
  ctx.moveTo(cx, cy - size*0.008);
  ctx.lineTo(cx, cy + size*0.040);
  ctx.stroke();

  ctx.restore();
}
function drawBottomMarkers(ctx, cx, bodyY, bodyH, size){
  ctx.save();
  ctx.fillStyle = '#ffffff';
  const yy = bodyY + bodyH*0.88;
  const bw = size*0.035;
  const bh = size*0.012;

  ctx.beginPath();
  ctx.moveTo(cx - bw*2.6, yy);
  ctx.lineTo(cx - bw*1.7, yy - bh);
  ctx.lineTo(cx - bw*0.8, yy);
  ctx.closePath();
  ctx.fill();

  ctx.fillRect(cx - bw*0.35, yy - bh*1.8, bw*0.7, bh*2.2);

  ctx.beginPath();
  ctx.moveTo(cx + bw*0.8, yy);
  ctx.lineTo(cx + bw*1.7, yy - bh);
  ctx.lineTo(cx + bw*2.6, yy);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// Render a true-looking spherical attitude ball by shading each pixel
// Render a spherical attitude ball with graphics inspired by the new reference dial
function renderBallTexture(pitchDeg, rollDeg){
  const r = TEX * 0.5;
  const cx = TEX * 0.5;
  const cy = TEX * 0.5;

  const roll = rollDeg * Math.PI / 180;
  const pitch = pitchDeg * Math.PI / 180;

  const cr = Math.cos(-roll), sr = Math.sin(-roll);
  const cp = Math.cos(-pitch), sp = Math.sin(-pitch);

  function rotateToBallLocal(x,y,z){
    let x1 = x*cr - y*sr;
    let y1 = x*sr + y*cr;
    let z1 = z;
    let x2 = x1;
    let y2 = y1*cp - z1*sp;
    let z2 = y1*sp + z1*cp;
    return [x2,y2,z2];
  }

  // Ball-local point -> visible projected point on the displayed sphere.
  // This is the exact inverse of rotateToBallLocal(), so labels and lines
  // now move together in the same direction.
  function projectBallPoint(lon, lat){
    // local coordinates on unit sphere
    const x = Math.sin(lon) * Math.cos(lat);
    const y = Math.sin(lat);
    const z = Math.cos(lon) * Math.cos(lat);

    // Forward pitch rotation: Rx(+pitch)
    const xp = x;
    const yp = y*Math.cos(pitch) - z*Math.sin(pitch);
    const zp = y*Math.sin(pitch) + z*Math.cos(pitch);

    // Forward roll rotation: Rz(+roll)
    const xv = xp*Math.cos(roll) - yp*Math.sin(roll);
    const yv = xp*Math.sin(roll) + yp*Math.cos(roll);
    const zv = zp;

    return {x: cx + xv*r, y: cy + yv*r, z: zv};
  }

  function skyColor(t){
    const top = [145, 198, 242];
    const mid = [88, 150, 212];
    const bot = [58, 110, 174];
    if (t < 0.5){
      const u = t/0.5;
      return [
        top[0] + (mid[0]-top[0])*u,
        top[1] + (mid[1]-top[1])*u,
        top[2] + (mid[2]-top[2])*u
      ];
    }
    const u = (t-0.5)/0.5;
    return [
      mid[0] + (bot[0]-mid[0])*u,
      mid[1] + (bot[1]-mid[1])*u,
      mid[2] + (bot[2]-mid[2])*u
    ];
  }

  function groundColor(t){
    const top = [113, 74, 42];
    const mid = [86, 54, 28];
    const bot = [45, 28, 14];
    if (t < 0.5){
      const u = t/0.5;
      return [
        top[0] + (mid[0]-top[0])*u,
        top[1] + (mid[1]-top[1])*u,
        top[2] + (mid[2]-top[2])*u
      ];
    }
    const u = (t-0.5)/0.5;
    return [
      mid[0] + (bot[0]-mid[0])*u,
      mid[1] + (bot[1]-mid[1])*u,
      mid[2] + (bot[2]-mid[2])*u
    ];
  }

  function onPitchLine(elev, lon, deg){
    const lat = deg * Math.PI / 180;
    const major = deg % 10 === 0;
    const lineHalf = (major ? 0.62 : 0.42);
    const gap = 0.11;
    const thick = major ? 0.008 : 0.006;
    if (Math.abs(elev - lat) < thick){
      const a = Math.abs(lon);
      if (a > gap && a < lineHalf) return true;
    }
    return false;
  }

  function onCenterShortBar(elev, lon){
    return Math.abs(elev) < 0.010 && Math.abs(lon) < 0.10;
  }

  const light = [-0.40, -0.52, 0.82];

  for(let y=0; y<TEX; y++){
    for(let x=0; x<TEX; x++){
      const idx = (y*TEX + x) * 4;
      const nx = (x + 0.5 - cx) / r;
      const ny = (y + 0.5 - cy) / r;
      const rr = nx*nx + ny*ny;

      if (rr > 1){
        px[idx+0]=0; px[idx+1]=0; px[idx+2]=0; px[idx+3]=0;
        continue;
      }

      const nz = Math.sqrt(1 - rr);
      const p = rotateToBallLocal(nx, ny, nz);
      const bx = p[0], by = p[1], bz = p[2];
      const elev = Math.asin(by);
      const lon = Math.atan2(bx, bz);

      let col;
      // Color convention: blue is up, brown is down
      if (by >= 0){
        const t = Math.min(1, Math.max(0, (1 - by) * 0.85));
        col = groundColor(t);
      } else {
        const t = Math.min(1, Math.max(0, (-by) * 1.10));
        col = skyColor(t);
      }

      // orange horizon
      if (Math.abs(by) < 0.010){
        col = [243, 154, 30];
      }

      // white pitch ladder lines
      for (let d=-20; d<=20; d+=5){
        if (d !== 0 && onPitchLine(elev, lon, d)){
          col = [240,243,245];
        }
      }

      // short center orange horizon segment
      if (onCenterShortBar(elev, lon)){
        col = [243, 154, 30];
      }

      // white center vertical pitch scale
      if (Math.abs(bx) < 0.008 && Math.abs(by) < 0.36){
        col = [240,243,245];
      }

      // center small dark hub
      if (Math.abs(bx) < 0.025 && Math.abs(by) < 0.025){
        col = [40, 34, 26];
      }

      // spherical shading
      let shade = 0.68 + 0.32*(nx*light[0] + ny*light[1] + nz*light[2]);
      shade *= (0.90 + 0.10*nz);
      shade = Math.max(0.20, Math.min(1.12, shade));

      const spec = Math.pow(Math.max(0, nx*(-0.16) + ny*(-0.30) + nz*(0.94)), 18) * 0.22;

      px[idx+0] = Math.max(0, Math.min(255, col[0]*shade + 255*spec));
      px[idx+1] = Math.max(0, Math.min(255, col[1]*shade + 255*spec));
      px[idx+2] = Math.max(0, Math.min(255, col[2]*shade + 255*spec));
      px[idx+3] = 255;
    }
  }

  texCtx.putImageData(imgData, 0, 0);

  // Draw pitch numbers ON the ball texture so they move with the ladder lines
  texCtx.save();
  texCtx.fillStyle = '#f1f4f5';
  texCtx.font = `bold ${Math.round(TEX*0.062)}px Arial`;
  texCtx.textBaseline = 'middle';

  function drawMovingPair(text, deg, lonMag){
    const lat = deg * Math.PI / 180;
    const eps = 0.018;

    function drawOne(lon, align, offsetSign){
      const p = projectBallPoint(lon, lat);
      if (p.z <= 0.02) return;

      // Find the local tangent of the same pitch line after projection.
      // The number therefore rolls exactly with its corresponding line.
      const p1 = projectBallPoint(lon - eps, lat);
      const p2 = projectBallPoint(lon + eps, lat);
      const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);

      texCtx.save();
      texCtx.translate(p.x, p.y);
      texCtx.rotate(angle);
      texCtx.textAlign = align;
      texCtx.fillText(text, offsetSign * TEX*0.014, 0);
      texCtx.restore();
    }

    drawOne(-lonMag, 'right', -1);
    drawOne( lonMag, 'left',   1);
  }

  // Same pitch values as the major pitch lines
  drawMovingPair('20',  20, 0.46);
  drawMovingPair('10',  10, 0.39);
  drawMovingPair('10', -10, 0.39);
  drawMovingPair('20', -20, 0.46);

  texCtx.restore();
}
function ringPath(ctx, cx, cy, outerR, innerR){
  ctx.beginPath();
  ctx.arc(cx, cy, outerR, 0, Math.PI*2);
  ctx.arc(cx, cy, innerR, 0, Math.PI*2, true);
  ctx.closePath();
}

function drawBrushedUsedRing(ctx, cx, cy, outerR, innerR, baseCols){
  // Base anodized dark-gray aluminum
  const g = ctx.createLinearGradient(cx-outerR, cy-outerR, cx+outerR, cy+outerR);
  g.addColorStop(0, baseCols[0]);
  g.addColorStop(0.18, baseCols[1]);
  g.addColorStop(0.50, baseCols[2]);
  g.addColorStop(0.82, baseCols[3]);
  g.addColorStop(1, baseCols[4]);

  ctx.save();
  ringPath(ctx, cx, cy, outerR, innerR);
  ctx.fillStyle = g;
  ctx.fill('evenodd');

  // Brushed aluminum streaks
  ctx.clip('evenodd');
  for(let i=0; i<160; i++){
    const t = i / 160;
    const ang = -0.85 + t * 1.75;
    const r1 = innerR + (outerR-innerR) * (0.10 + 0.75 * ((i*37)%97)/96);
    const len = (outerR-innerR) * (0.42 + 0.28 * ((i*19)%31)/30);
    const x1 = cx + Math.cos(ang) * r1;
    const y1 = cy + Math.sin(ang) * r1;
    const x2 = cx + Math.cos(ang) * (r1 + len);
    const y2 = cy + Math.sin(ang) * (r1 + len);

    const alpha = 0.018 + (((i*13)%11)/10) * 0.020;
    ctx.strokeStyle = `rgba(255,255,255,${alpha.toFixed(3)})`;
    ctx.lineWidth = 0.8 + (((i*11)%9)/8) * 0.9;
    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);
    ctx.stroke();
  }

  // Slightly polished edge highlights
  ctx.strokeStyle = 'rgba(255,255,255,0.17)';
  ctx.lineWidth = Math.max(1, (outerR-innerR) * 0.11);
  ctx.beginPath();
  ctx.arc(cx, cy, outerR - (outerR-innerR)*0.22, -2.35, -1.18);
  ctx.stroke();

  ctx.strokeStyle = 'rgba(255,255,255,0.09)';
  ctx.lineWidth = Math.max(1, (outerR-innerR) * 0.07);
  ctx.beginPath();
  ctx.arc(cx, cy, innerR + (outerR-innerR)*0.40, 0.55, 1.55);
  ctx.stroke();

  // Slightly worn darker patches
  ctx.strokeStyle = 'rgba(0,0,0,0.14)';
  ctx.lineWidth = Math.max(1, (outerR-innerR) * 0.12);
  ctx.beginPath();
  ctx.arc(cx, cy, outerR - (outerR-innerR)*0.35, 1.85, 2.85);
  ctx.stroke();

  // Fine scuffs: used but not old
  for(let i=0; i<18; i++){
    const a = -2.2 + i*0.24;
    const rr = innerR + (outerR-innerR) * (0.48 + 0.18 * Math.sin(i*1.7));
    const span = 0.035 + (i % 3) * 0.01;
    ctx.strokeStyle = i % 4 === 0 ? 'rgba(255,255,255,0.12)' : 'rgba(0,0,0,0.11)';
    ctx.lineWidth = 0.8 + (i % 3) * 0.5;
    ctx.beginPath();
    ctx.arc(cx, cy, rr, a, a + span);
    ctx.stroke();
  }

  ctx.restore();
}


function seededNoise(n){
  const x = Math.sin(n * 12.9898 + 78.233) * 43758.5453;
  return x - Math.floor(x);
}


function drawDialNumbers(ctx, cx, cy, size){
  ctx.save();
  ctx.fillStyle = '#f1f4f5';
  ctx.font = `bold ${Math.round(size*0.032)}px Arial`;
  ctx.textBaseline = 'middle';

  function drawPair(txt, y, xoff){
    // left number sits just outside the left pitch line
    ctx.textAlign = 'right';
    ctx.fillText(txt, cx - xoff, y);

    // right number sits just outside the right pitch line
    ctx.textAlign = 'left';
    ctx.fillText(txt, cx + xoff, y);
  }

  // numbers aligned to the same vertical levels as the pitch bars
  drawPair('20', cy - size*0.145, size*0.070);
  drawPair('10', cy - size*0.072, size*0.058);
  drawPair('10', cy + size*0.075, size*0.058);
  drawPair('20', cy + size*0.145, size*0.070);

  ctx.restore();
}

function drawMatteAircraftBezel(ctx, cx, cy, size, bodyX, bodyY, bodyW, bodyH, bezelR){
  // Based on the new reference: black painted / enamel-style instrument bezel,
  // satin black, slightly pebbled/cast, lightly used, not metallic gray.

  const face = ctx.createLinearGradient(bodyX, bodyY, bodyX, bodyY + bodyH);
  face.addColorStop(0, '#2e3236');
  face.addColorStop(0.22, '#25292d');
  face.addColorStop(0.58, '#1a1d20');
  face.addColorStop(1, '#121416');
  ctx.fillStyle = face;
  roundedRect(ctx, bodyX, bodyY, bodyW, bodyH, size*0.075);
  ctx.fill();

  // Cast / orange-peel paint texture
  ctx.save();
  roundedRect(ctx, bodyX, bodyY, bodyW, bodyH, size*0.075);
  ctx.clip();

  for(let i=0;i<2600;i++){
    const rx = seededNoise(i*2.17);
    const ry = seededNoise(i*6.91);
    const rr = 0.35 + seededNoise(i*5.13)*1.35;
    const alpha = 0.010 + seededNoise(i*9.11)*0.020;
    ctx.fillStyle = seededNoise(i*4.31) > 0.45
      ? `rgba(255,255,255,${alpha})`
      : `rgba(0,0,0,${alpha*1.05})`;
    ctx.beginPath();
    ctx.arc(bodyX + rx*bodyW, bodyY + ry*bodyH, rr*size*0.0020, 0, Math.PI*2);
    ctx.fill();
  }

  for(let i=0;i<520;i++){
    const rx = seededNoise(i*12.4);
    const ry = seededNoise(i*7.6);
    const rr = size*(0.004 + seededNoise(i*2.9)*0.004);
    const gx = bodyX + rx*bodyW;
    const gy = bodyY + ry*bodyH;
    const blob = ctx.createRadialGradient(gx, gy, 0, gx, gy, rr);
    blob.addColorStop(0, i%2===0 ? 'rgba(255,255,255,0.030)' : 'rgba(0,0,0,0.040)');
    blob.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = blob;
    ctx.beginPath();
    ctx.arc(gx, gy, rr, 0, Math.PI*2);
    ctx.fill();
  }

  // faint handling / wipe marks
  for(let i=0;i<180;i++){
    const yy = bodyY + seededNoise(i*3.1) * bodyH;
    const xx = bodyX + seededNoise(i*7.2) * bodyW * 0.28;
    const len = bodyW * (0.40 + seededNoise(i*4.7)*0.45);
    const alpha = 0.008 + seededNoise(i*2.5)*0.012;
    ctx.strokeStyle = i % 2 === 0
      ? `rgba(255,255,255,${alpha})`
      : `rgba(0,0,0,${alpha})`;
    ctx.lineWidth = size*0.0010 + seededNoise(i*8.1)*size*0.0011;
    ctx.beginPath();
    ctx.moveTo(xx, yy);
    ctx.lineTo(Math.min(bodyX+bodyW, xx+len), yy + (seededNoise(i*5.4)-0.5)*size*0.002);
    ctx.stroke();
  }

  // soft satin sheen
  const sheen = ctx.createLinearGradient(bodyX, bodyY, bodyX+bodyW, bodyY+bodyH);
  sheen.addColorStop(0, 'rgba(255,255,255,0.07)');
  sheen.addColorStop(0.12, 'rgba(255,255,255,0.02)');
  sheen.addColorStop(0.30, 'rgba(255,255,255,0.00)');
  sheen.addColorStop(0.75, 'rgba(0,0,0,0.00)');
  sheen.addColorStop(1, 'rgba(0,0,0,0.10)');
  ctx.fillStyle = sheen;
  roundedRect(ctx, bodyX, bodyY, bodyW, bodyH, size*0.075);
  ctx.fill();

  ctx.restore();

  // outline and subtle top edge
  ctx.strokeStyle = '#090b0d';
  ctx.lineWidth = size*0.010;
  roundedRect(ctx, bodyX, bodyY, bodyW, bodyH, size*0.075);
  ctx.stroke();

  ctx.strokeStyle = 'rgba(255,255,255,0.045)';
  ctx.lineWidth = size*0.0022;
  roundedRect(ctx, bodyX + size*0.006, bodyY + size*0.006,
              bodyW - size*0.012, bodyH - size*0.012, size*0.067);
  ctx.stroke();

  // recessed circular opening
  const recessOuter = bezelR*1.09;
  const recessInner = bezelR*0.88;

  const cavity = ctx.createRadialGradient(cx, cy, recessInner*0.68, cx, cy, recessOuter);
  cavity.addColorStop(0, '#0f1113');
  cavity.addColorStop(0.72, '#090b0c');
  cavity.addColorStop(1, '#010202');
  ctx.fillStyle = cavity;
  ctx.beginPath();
  ctx.arc(cx, cy, recessOuter, 0, Math.PI*2);
  ctx.fill();

  // inner lip, black painted, smoother from rubbing/use
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, recessOuter, 0, Math.PI*2);
  ctx.arc(cx, cy, recessInner, 0, Math.PI*2, true);
  ctx.closePath();

  const lip = ctx.createLinearGradient(cx-recessOuter, cy-recessOuter, cx+recessOuter, cy+recessOuter);
  lip.addColorStop(0, '#3d4246');
  lip.addColorStop(0.18, '#2a2e32');
  lip.addColorStop(0.50, '#171a1d');
  lip.addColorStop(0.82, '#24282b');
  lip.addColorStop(1, '#44494e');
  ctx.fillStyle = lip;
  ctx.fill('evenodd');
  ctx.clip('evenodd');

  for(let i=0;i<360;i++){
    const a = i/360 * Math.PI*2;
    const r1 = recessInner + (recessOuter-recessInner)*(0.08 + 0.18*seededNoise(i*2.8));
    const r2 = recessOuter - (recessOuter-recessInner)*(0.06 + 0.12*seededNoise(i*4.1));
    const alpha = 0.008 + seededNoise(i*7.9)*0.016;
    ctx.strokeStyle = i % 2 === 0
      ? `rgba(255,255,255,${alpha})`
      : `rgba(0,0,0,${alpha*1.1})`;
    ctx.lineWidth = 0.45 + seededNoise(i*6.3)*0.65;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a)*r1, cy + Math.sin(a)*r1);
    ctx.lineTo(cx + Math.cos(a)*r2, cy + Math.sin(a)*r2);
    ctx.stroke();
  }

  for(let i=0;i<24;i++){
    const rr = recessInner + (recessOuter-recessInner)*(0.20 + seededNoise(i*5.7)*0.55);
    const a0 = seededNoise(i*2.2) * Math.PI*2;
    const span = 0.10 + seededNoise(i*3.6)*0.24;
    ctx.strokeStyle = i % 2 === 0 ? 'rgba(255,255,255,0.045)' : 'rgba(0,0,0,0.055)';
    ctx.lineWidth = 0.8 + seededNoise(i*8.5)*0.5;
    ctx.beginPath();
    ctx.arc(cx, cy, rr, a0, a0+span);
    ctx.stroke();
  }
  ctx.restore();

  // dark shadow under lip
  ctx.strokeStyle = 'rgba(0,0,0,0.78)';
  ctx.lineWidth = size*0.009;
  ctx.beginPath();
  ctx.arc(cx, cy, recessInner, 0, Math.PI*2);
  ctx.stroke();

  // used but not abused edge wear
  ctx.save();
  ctx.lineCap = 'round';
  const scratches = [
    [bodyX+bodyW*0.16, bodyY+bodyH*0.11, 0.050, -0.55],
    [bodyX+bodyW*0.73, bodyY+bodyH*0.08, 0.038,  0.22],
    [bodyX+bodyW*0.12, bodyY+bodyH*0.65, 0.045, -0.12],
    [bodyX+bodyW*0.79, bodyY+bodyH*0.77, 0.045,  0.46],
    [bodyX+bodyW*0.55, bodyY+bodyH*0.91, 0.026, -0.30],
    [bodyX+bodyW*0.86, bodyY+bodyH*0.47, 0.020, -0.42]
  ];
  scratches.forEach((s,idx)=>{
    const [sx,sy,length,ang] = s;
    ctx.strokeStyle = idx%2===0 ? 'rgba(220,225,228,0.15)' : 'rgba(0,0,0,0.18)';
    ctx.lineWidth = size*0.0014;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx + Math.cos(ang)*size*length, sy + Math.sin(ang)*size*length);
    ctx.stroke();
  });

  ctx.strokeStyle = 'rgba(185,190,194,0.12)';
  ctx.lineWidth = size*0.0028;
  ctx.beginPath();
  ctx.arc(cx, cy, recessOuter-size*0.003, -2.42, -1.72);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx, cy, recessOuter-size*0.003, 0.55, 1.10);
  ctx.stroke();
  ctx.restore();
}
function draw(){
  const {ctx,w,h} = fitCanvas(canvas);
  ctx.clearRect(0,0,w,h);

  const size = Math.min(w,h);
  const cx = w/2;
  const cy = h/2;

  ctx.fillStyle = '#11161a';
  ctx.fillRect(0,0,w,h);

  // square case + matte dark-gray aircraft bezel
  const bodyX = cx - size*0.44;
  const bodyY = cy - size*0.44;
  const bodyW = size*0.88;
  const bodyH = size*0.88;
  const bezelR = size*0.365;

  drawMatteAircraftBezel(ctx, cx, cy, size, bodyX, bodyY, bodyW, bodyH, bezelR);

  // darker, more utilitarian screws
  drawScrew(ctx, bodyX + bodyW*0.09, bodyY + bodyH*0.08, size*0.016);
  drawScrew(ctx, bodyX + bodyW*0.91, bodyY + bodyH*0.08, size*0.016);
  drawScrew(ctx, bodyX + bodyW*0.09, bodyY + bodyH*0.92, size*0.016);
  drawScrew(ctx, bodyX + bodyW*0.91, bodyY + bodyH*0.92, size*0.016);

  // gimbal ring darker and more like black painted instrument hardware
  const ringOuter = size*0.332;
  const ringInner = size*0.312;
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, ringOuter, 0, Math.PI*2);
  ctx.arc(cx, cy, ringInner, 0, Math.PI*2, true);
  ctx.closePath();
  const ringGrad = ctx.createLinearGradient(cx-ringOuter, cy-ringOuter, cx+ringOuter, cy+ringOuter);
  ringGrad.addColorStop(0, '#363a3e');
  ringGrad.addColorStop(0.20, '#23272a');
  ringGrad.addColorStop(0.50, '#15181a');
  ringGrad.addColorStop(0.80, '#25292c');
  ringGrad.addColorStop(1, '#3d4246');
  ctx.fillStyle = ringGrad;
  ctx.fill('evenodd');

  ctx.clip('evenodd');
  for(let i=0;i<260;i++){
    const a = i/260 * Math.PI*2;
    const r1 = ringInner + (ringOuter-ringInner)*(0.12 + 0.18*seededNoise(i*3.7));
    const r2 = ringOuter - (ringOuter-ringInner)*(0.08 + 0.12*seededNoise(i*4.9));
    const alpha = 0.010 + seededNoise(i*2.6)*0.016;
    ctx.strokeStyle = i % 3 === 0
      ? `rgba(255,255,255,${alpha})`
      : `rgba(0,0,0,${alpha})`;
    ctx.lineWidth = 0.5 + seededNoise(i*6.2)*0.6;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a)*r1, cy + Math.sin(a)*r1);
    ctx.lineTo(cx + Math.cos(a)*r2, cy + Math.sin(a)*r2);
    ctx.stroke();
  }
  for(let i=0;i<14;i++){
    const rr = ringInner + (ringOuter-ringInner)*(0.28 + seededNoise(i*4.4)*0.36);
    const a0 = seededNoise(i*3.1) * Math.PI*2;
    const span = 0.10 + seededNoise(i*8.8)*0.12;
    ctx.strokeStyle = i % 2 === 0 ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.05)';
    ctx.lineWidth = 0.9;
    ctx.beginPath();
    ctx.arc(cx, cy, rr, a0, a0+span);
    ctx.stroke();
  }
  ctx.restore();

  drawTrunnion(ctx, cx - ringOuter, cy, size*0.025);
  drawTrunnion(ctx, cx + ringOuter, cy, size*0.025);

  // render and draw spherical ball
  // Correct attitude-indicator convention: pitch-up makes the horizon move down.
  renderBallTexture(-state.pitch, state.roll);
  const ballR = size*0.300;

  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, ballR, 0, Math.PI*2);
  ctx.clip();
  ctx.drawImage(texCanvas, cx-ballR, cy-ballR, ballR*2, ballR*2);

  // extra glass sheen over ball
  const glass = ctx.createLinearGradient(cx - ballR*0.85, cy - ballR*0.85, cx + ballR*0.55, cy + ballR*0.55);
  glass.addColorStop(0, 'rgba(160,225,236,0.14)');
  glass.addColorStop(0.16, 'rgba(255,255,255,0.06)');
  glass.addColorStop(0.45, 'rgba(255,255,255,0)');
  glass.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glass;
  ctx.beginPath();
  ctx.arc(cx, cy, ballR, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  // rim around the ball
  ctx.beginPath();
  ctx.arc(cx, cy, ballR, 0, Math.PI*2);
  ctx.strokeStyle = '#020304';
  ctx.lineWidth = size*0.012;
  ctx.stroke();

  drawBankScale(ctx, cx, cy, ballR*1.02, size);
  drawAircraftSymbol(ctx, cx, cy, size);
  drawBottomMarkers(ctx, cx, bodyY, bodyH, size);

  // subtle case reflection
  const refl = ctx.createLinearGradient(bodyX, bodyY, bodyX+bodyW, bodyY+bodyH);
  refl.addColorStop(0, 'rgba(95,200,210,0.10)');
  refl.addColorStop(0.16, 'rgba(255,255,255,0.03)');
  refl.addColorStop(0.38, 'rgba(255,255,255,0)');
  refl.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = refl;
  roundedRect(ctx, bodyX, bodyY, bodyW, bodyH, size*0.08);
  ctx.fill();
}

window.addEventListener('resize', draw);

let t0 = performance.now();
function animate(ts){
  if (!state.nativeActive){
    state.pitch = 0;
    state.roll = 0;
  }
  draw();
  requestAnimationFrame(animate);
}

draw();
requestAnimationFrame(animate);

})();

const state = {
  heading: 0,
  demoHeading: 0,
  sensorActive: false,
  permissionAsked: false,
  smoothHeading: 0

window.setGpsHeading = function(trackDeg){
  if (!Number.isFinite(trackDeg)) return;
  state.heading = normalizeHeading(trackDeg);
  state.sensorActive = true;
};

function fitCanvas(c){
  const rect = c.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;

  if(c.width !== w || c.height !== h){
    c.width = w;
    c.height = h;

  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

  ctx.fill();
  ctx.strokeStyle='#07090a';
  ctx.lineWidth=r*.18;

  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(angle);
  ctx.strokeStyle='#2b3033';
  ctx.lineWidth=r*.17;
  ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(-r*.52,0);
  ctx.lineTo(r*.52,0);
  ctx.stroke();
  ctx.restore();
}

function drawHousing(ctx,cx,cy,size){
  const x=cx-size*.43;
  const y=cy-size*.43;
  const w=size*.86;
  const h=size*.86;

  const g=ctx.createLinearGradient(x,y,x,y+h);
  g.addColorStop(0,'#2d3236');
  g.addColorStop(.25,'#23272a');
  g.addColorStop(.62,'#181b1e');
  g.addColorStop(1,'#101214');
  ctx.fillStyle=g;

    const ry=seed(i*6.37);

      : `rgba(0,0,0,${a*1.1})`;

    ctx.arc(x+rx*w,y+ry*h,rr,0,Math.PI*2);
    ctx.fill();
  }

  ring.addColorStop(.18,'#2b3033');
  ring.addColorStop(.5,'#171a1c');
  ring.addColorStop(.82,'#282c2f');
  ring.addColorStop(1,'#484d51');

    const a=i/420*Math.PI*2;

  }

function drawDialFromReference(ctx,cx,cy,size,innerR,heading){

  face.addColorStop(1,'#070809');
  ctx.fillStyle=face;
  ctx.beginPath();
  ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.fill();

  // Clip to circular window
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.clip();

  // Rotate exact dial image according to phone north.
  // We use the uploaded reference image itself and spin it as a compass card.
  ctx.translate(cx,cy);
  ctx.rotate(-heading * Math.PI / 180);

  // Scale so the dial graphic fills the circular area nicely
  const scale = (r * 2.25) / Math.min(dialImg.width, dialImg.height);
  const dw = dialImg.width * scale;
  const dh = dialImg.height * scale;

  ctx.drawImage(dialImg, -dw/2, -dh/2, dw, dh);
  ctx.restore();

  // Fixed top lubber triangle
  ctx.fillStyle = '#f4f5f3';
  ctx.beginPath();
  ctx.moveTo(cx, cy - r*0.98);
  ctx.lineTo(cx - size*0.014, cy - r*0.88);
  ctx.lineTo(cx + size*0.014, cy - r*0.88);
  ctx.closePath();
  ctx.fill();

  // subtle glass
  const glass=ctx.createLinearGradient(cx-r,cy-r,cx+r,cy+r);
  glass.addColorStop(0,'rgba(255,255,255,.10)');
  glass.addColorStop(.16,'rgba(255,255,255,.035)');
  glass.addColorStop(.42,'rgba(255,255,255,0)');
  glass.addColorStop(1,'rgba(0,0,0,.06)');
  ctx.fillStyle=glass;
  ctx.beginPath();
  ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.fill();
}

function draw(){
  const {ctx,w,h} = fitCanvas(canvas);
  ctx.clearRect(0,0,w,h);

  const size = Math.min(w,h);
  const cx = w/2;
  const cy = h/2;

  ctx.fillStyle='#111416';
  ctx.fillRect(0,0,w,h);

  drawHousing(ctx,cx,cy,size);
  const bezel = drawBezel(ctx,cx,cy,size);

  // GPS track only. If no valid track is available, hold the last displayed value.
  let target = state.sensorActive ? state.heading : state.smoothHeading;
  let delta = ((target - state.smoothHeading + 540) % 360) - 180;
  state.smoothHeading = (state.smoothHeading + delta * 0.12 + 360) % 360;

  drawDialFromReference(ctx,cx,cy,size,bezel.inner,state.smoothHeading);
  readout.textContent = `Heading: ${Math.round(state.smoothHeading)}°${state.sensorActive ? '' : ' (demo)'}`;
}

function normalizeHeading(deg){
  return (deg % 360 + 360) % 360;
}

function handleOrientation(event){
  let heading = null;

  // iOS Safari true compass heading
  if (typeof event.webkitCompassHeading === 'number') {
    heading = event.webkitCompassHeading;
  } else if (typeof event.alpha === 'number') {
    // Generic fallback. Depending on device/browser, alpha may be magnetic heading-like.
    // Use 360-alpha so North-up behaves as expected in many implementations.
    heading = 360 - event.alpha;
  }

  if (heading != null && !Number.isNaN(heading)) {
    state.heading = normalizeHeading(heading);
    state.sensorActive = true;
  }
}

async function enableCompass(){
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    try {
      const result = await DeviceOrientationEvent.requestPermission();
      if (result === 'granted') {
        window.addEventListener('deviceorientation', handleOrientation, true);
        permBtn.style.display = 'none';
      } else {
        readout.textContent = 'Compass permission denied';
      }
    } catch (err) {
      readout.textContent = 'Compass permission error';
    }
  } else {
    window.addEventListener('deviceorientationabsolute', handleOrientation, true);
    window.addEventListener('deviceorientation', handleOrientation, true);
    permBtn.style.display = 'none';
  }
}

function initCompass(){
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    permBtn.style.display = 'inline-block';
  } else {
    window.addEventListener('deviceorientationabsolute', handleOrientation, true);
    window.addEventListener('deviceorientation', handleOrientation, true);
  }
}

permBtn.addEventListener('click', enableCompass);
window.addEventListener('resize', draw);

let t0 = performance.now();
function animate(ts){
  draw();
  requestAnimationFrame(animate);
}

dialImg.onload = () => {
  // Native Android GPS supplies track; do not start browser compass listeners.
  draw();
  requestAnimationFrame(animate);
};

})();

  ctx.lineTo(shaftMidX,   -size*.0080);
  ctx.lineTo(shaftMidX,    size*.0080);
  ctx.lineTo(shaftStartX,  size*.0080);
  ctx.closePath();
  ctx.fill();

  // outer half: thin
  ctx.beginPath();
  ctx.moveTo(shaftMidX, -size*.0035);
  ctx.lineTo(shaftEndX, -size*.0035);
  ctx.lineTo(shaftEndX,  size*.0035);
  ctx.lineTo(shaftMidX,  size*.0035);
  ctx.closePath();
  ctx.fill();

  // TENS-OF-THOUSANDS pointer:
  // Symmetric inward-pointing isosceles triangle.
  const triBaseX = r*.86;
  const triLength = size*.054;
  const triHalfWidth = size*.027;
  const triApexX = triBaseX - triLength;

  ctx.fillStyle='#f1f1ed';
  ctx.beginPath();
  ctx.moveTo(triApexX, 0);                   // inward-facing apex
  ctx.lineTo(triBaseX, -triHalfWidth);       // upper base corner
  ctx.lineTo(triBaseX,  triHalfWidth);       // lower base corner
  ctx.closePath();
  ctx.fill();

  // subtle center line
  ctx.strokeStyle='rgba(20,22,23,0.55)';
  ctx.lineWidth=size*.0012;
  ctx.beginPath();
  ctx.moveTo(triApexX + triLength*.12, 0);
  ctx.lineTo(triBaseX - triLength*.10, 0);
  ctx.stroke();

  ctx.restore();

  ctx.restore();

  // center hub
  const hub=ctx.createRadialGradient(cx-size*.008,cy-size*.008,size*.004,cx,cy,size*.034);
  hub.addColorStop(0,'#4f5151');
  hub.addColorStop(.5,'#202223');
  hub.addColorStop(1,'#080909');
  ctx.fillStyle=hub;
  ctx.beginPath();
  ctx.arc(cx,cy,size*.033,0,Math.PI*2);
  ctx.fill();

  ctx.strokeStyle='#060707';
  ctx.lineWidth=size*.004;
  ctx.stroke();
}

function drawReadoutBox(ctx,cx,cy,size,feet){
  const w = size*.18;                 // smaller box
  const h = size*.048;
  const x = cx - w/2;                 // centered horizontally
  const y = cy + size*.09 - h/2;      // same halfway position

  ctx.fillStyle='rgba(8,10,11,0.92)';
  ctx.strokeStyle='rgba(255,255,255,0.08)';
  ctx.lineWidth=size*.002;
  roundedRect(ctx, x, y, w, h, size*.007);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle='#ffffff';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.font=`bold ${Math.round(size*.028)}px Arial`;  // larger numbers
  ctx.fillText(`${Math.round(feet).toLocaleString()} ft`, x+w/2, y+h/2);
}

function metersToFeet(m){
  return m * 3.28084;
}

function draw(){
  const {ctx,w,h}=fitCanvas(canvas);
  ctx.clearRect(0,0,w,h);

  const size=Math.min(w,h);
  const cx=w/2;
  const cy=h/2;

  ctx.fillStyle='#111416';
  ctx.fillRect(0,0,w,h);

  drawHousing(ctx,cx,cy,size);
  const bezel=drawBezel(ctx,cx,cy,size);
  const dialR=drawDial(ctx,cx,cy,size,bezel.inner);

  const targetFeet = state.gpsActive ? metersToFeet(state.altitudeM) : state.demoFeet;
  state.smoothFeet += (targetFeet - state.smoothFeet) * 0.12;

  // Draw the numeric altitude window first so all needles pass over it.
  drawReadoutBox(ctx,cx,cy,size,state.smoothFeet);
  drawAltimeterNeedles(ctx,cx,cy,dialR,size,state.smoothFeet);

  readout.textContent = `Altitude: ${Math.round(state.smoothFeet).toLocaleString()} ft (${state.gpsActive ? 'GPS' : 'demo'})`;
}

function geolocationSuccess(pos){
  if (typeof pos.coords.altitude === 'number' && !Number.isNaN(pos.coords.altitude)){
    state.altitudeM = pos.coords.altitude;
    state.gpsActive = true;
    state.message = 'GPS altitude active';
  } else {
    state.gpsActive = false;
    state.message = 'Altitude unavailable from browser GPS, using demo';
  }
}

function geolocationError(err){
  state.gpsActive = false;
  state.message = 'GPS unavailable, using demo';
}

function enableGPS(){
  if (!navigator.geolocation){
    state.message = 'Geolocation not supported, using demo';
    return;
  }
  navigator.geolocation.watchPosition(
    geolocationSuccess,
    geolocationError,
    {enableHighAccuracy:true, maximumAge:1000, timeout:15000}
  );
  gpsBtn.style.display = 'none';
}

function initGPS(){
  if (navigator.geolocation){
    gpsBtn.style.display = 'inline-block';
  }
}

gpsBtn.addEventListener('click', enableGPS);
window.addEventListener('resize', draw);

let t0 = performance.now();
function animate(ts){
  draw();
  requestAnimationFrame(animate);
}

// Native Android supplies GPS altitude; browser geolocation is not started.
draw();
requestAnimationFrame(animate);

})();

<script>
(function(){

const canvas = document.getElementById('vsiCanvas');

const state = {
  fpm: 0,
  targetFpm: 0
};

window.setVerticalSpeedFpm = function(fpm){
  if (!Number.isFinite(fpm)) return;

function fitCanvas(c){
  const rect = c.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(rect.width*dpr));
  const h = Math.max(1, Math.round(rect.height*dpr));
  if(c.width !== w || c.height !== h){
    c.width = w;
    c.height = h;
  }
  return {ctx:c.getContext('2d'),w,h};
}

function roundedRect(ctx,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function seed(n){
  const x=Math.sin(n*12.9898+78.233)*43758.5453;
  return x-Math.floor(x);
}

function drawScrew(ctx,cx,cy,r,angle){
  const g=ctx.createRadialGradient(cx-r*.3,cy-r*.3,r*.08,cx,cy,r);
  g.addColorStop(0,'#8e9498');
  g.addColorStop(.42,'#555b60');
  g.addColorStop(1,'#1d2124');
  ctx.beginPath();
  ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.fillStyle=g;
  ctx.fill();
  ctx.strokeStyle='#090b0c';
  ctx.lineWidth=r*.18;
  ctx.stroke();

  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(angle);
  ctx.strokeStyle='#2f3437';
  ctx.lineWidth=r*.17;
  ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(-r*.55,0);
  ctx.lineTo(r*.55,0);
  ctx.stroke();
  ctx.restore();
}

function drawHousing(ctx,cx,cy,size){
  const x=cx-size*.43;
  const y=cy-size*.43;
  const w=size*.86;
  const h=size*.86;

  const g=ctx.createLinearGradient(x,y,x,y+h);
  g.addColorStop(0,'#303438');
  g.addColorStop(.24,'#25292c');
  g.addColorStop(.62,'#181b1e');
  g.addColorStop(1,'#101214');
  ctx.fillStyle=g;

  ctx.save();

      : `rgba(0,0,0,${a*1.15})`;

    [.79,.20,.08,.028],

    rg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=rg;
    ctx.beginPath();
    ctx.arc(gx,gy,rr,0,Math.PI*2);
    ctx.fill();

  ctx.restore();

  ctx.strokeStyle='#080a0b';
  ctx.lineWidth=size*.009;
  roundedRect(ctx,x,y,w,h,size*.065);
  ctx.stroke();

  ctx.strokeStyle='rgba(255,255,255,.045)';
  ctx.lineWidth=size*.002;
  roundedRect(ctx,x+size*.006,y+size*.006,w-size*.012,h-size*.012,size*.058);

  // corner screws
  drawScrew(ctx,x+w*.105,y+h*.105,size*.018,-.65);
  drawScrew(ctx,x+w*.895,y+h*.105,size*.018,.55);
  drawScrew(ctx,x+w*.105,y+h*.895,size*.018,.35);
  drawScrew(ctx,x+w*.895,y+h*.895,size*.018,-.45);

  return {x,y,w,h};
}

function drawBezel(ctx,cx,cy,size){
  const outer=size*.355;
  const inner=size*.296;

  // recessed cavity
  const cav=ctx.createRadialGradient(cx,cy,inner*.7,cx,cy,outer);
  cav.addColorStop(0,'#121416');
  cav.addColorStop(.74,'#080a0b');
  cav.addColorStop(1,'#010202');
  ctx.fillStyle=cav;
  ctx.beginPath();
  ctx.arc(cx,cy,outer,0,Math.PI*2);
  ctx.fill();

  // black painted ring
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx,cy,outer,0,Math.PI*2);
  ctx.arc(cx,cy,inner,0,Math.PI*2,true);
  ctx.closePath();

  const ring=ctx.createLinearGradient(cx-outer,cy-outer,cx+outer,cy+outer);
  ring.addColorStop(0,'#454a4d');
  ring.addColorStop(.18,'#2c3033');
  ring.addColorStop(.5,'#181b1d');
  ring.addColorStop(.82,'#292d30');
  ring.addColorStop(1,'#4b5054');

  ctx.clip('evenodd');

    const a=i/450*Math.PI*2;
    const r1=inner+(outer-inner)*(.08+.18*seed(i*3.5));

    ctx.strokeStyle=i%2===0
      ? `rgba(255,255,255,${al})`
      : `rgba(0,0,0,${al*1.15})`;
    ctx.lineWidth=.5+seed(i*8.9)*.7;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);
    ctx.lineTo(cx+Math.cos(a)*r2,cy+Math.sin(a)*r2);
    ctx.stroke();
  }
  ctx.restore();

  ctx.strokeStyle='rgba(0,0,0,.78)';
  ctx.lineWidth=size*.011;
  ctx.beginPath();
  ctx.arc(cx,cy,inner,0,Math.PI*2);

function angleForFpm(fpm){
  // 0 at left, climb clockwise upward/right; descend clockwise downward/right.
  // Full useful range is +/- 6000 fpm.
  const v=Math.max(-6000,Math.min(6000,fpm));
  if(v>=0){
    return Math.PI + (v/6000)*Math.PI;

function drawDial(ctx,cx,cy,size,innerR){
  const r=innerR*.94;

  // dial face
  const face=ctx.createRadialGradient(cx-size*.06,cy-size*.08,size*.02,cx,cy,r);
  face.addColorStop(0,'#232628');
  face.addColorStop(.62,'#101213');
  face.addColorStop(1,'#070809');

  ctx.beginPath();
  ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.fill();

  // subtle dial texture
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.clip();

    const a=seed(i*7.1)*Math.PI*2;
    const rr=Math.sqrt(seed(i*3.4))*r;
    const px=cx+Math.cos(a)*rr;
    const py=cy+Math.sin(a)*rr;
    const al=.008+seed(i*5.8)*.018;
    ctx.fillStyle=seed(i*9.2)>.5
      ? `rgba(255,255,255,${al})`
      : `rgba(0,0,0,${al})`;
    ctx.fillRect(px,py,size*.0012,size*.0012);
  }
  ctx.restore();

  // tick marks
  ctx.save();
  ctx.translate(cx,cy);
  ctx.strokeStyle='#f3f3ef';
  ctx.fillStyle='#f3f3ef';

  // 60 small divisions around circle = 100 fpm per division if 6000 full semi scale mapping style
  for(let i=0;i<60;i++){
    const a=i/60*Math.PI*2;
    const isMajor=i%5===0;
    const isMid=i%5===0 ? false : i%2===0;
    const outer=r*.91;
    const inner=isMajor ? r*.74 : (isMid ? r*.79 : r*.82);
    const x1=Math.cos(a)*inner;
    const y1=Math.sin(a)*inner;
    const x2=Math.cos(a)*outer;
    const y2=Math.sin(a)*outer;
    ctx.lineWidth=isMajor?size*.005:size*.0025;
    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);
    ctx.stroke();

  ctx.fillStyle='#f3f3ef';
  ctx.font=`bold ${Math.round(size*.058)}px Arial`;
  ctx.textAlign='center';
  ctx.textBaseline='middle';

  const labels=[
    ['0',Math.PI],
    ['2',Math.PI*1.5],
    ['4',Math.PI*1.75],
    ['6',0],
    ['4',Math.PI*.25],
    ['2',Math.PI*.5]
  ];

  labels.forEach(([txt,a])=>{
    const rr=r*.60;
    ctx.fillText(txt,cx+Math.cos(a)*rr,cy+Math.sin(a)*rr);
  });

  // small .5 marks left upper/lower
  ctx.font=`bold ${Math.round(size*.039)}px Arial`;
  ctx.fillText('.5',cx-r*.52,cy-r*.25);
  ctx.fillText('.5',cx-r*.52,cy+r*.25);

  // center text
  ctx.fillStyle='#f2f2ee';
  ctx.font=`bold ${Math.round(size*.024)}px Arial`;
  ctx.fillText('VERTICAL SPEED',cx,cy-r*.26);
  ctx.font=`bold ${Math.round(size*.019)}px Arial`;
  ctx.fillText('THOUSANDS FT / MIN',cx,cy-r*.165);

  // zero bug at left
  ctx.fillStyle='#f3f3ef';
  ctx.beginPath();
  ctx.moveTo(cx-r*.93,cy);
  ctx.lineTo(cx-r*.84,cy-size*.018);
  ctx.lineTo(cx-r*.84,cy+size*.018);
  ctx.closePath();
  ctx.fill();

  // glass
  const glass=ctx.createLinearGradient(cx-r,cy-r,cx+r,cy+r);
  glass.addColorStop(0,'rgba(255,255,255,.10)');
  glass.addColorStop(.16,'rgba(255,255,255,.035)');
  glass.addColorStop(.42,'rgba(255,255,255,0)');
  glass.addColorStop(1,'rgba(0,0,0,.06)');
  ctx.fillStyle=glass;
  ctx.beginPath();
  ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.fill();

  return r;
}

function drawNeedle(ctx,cx,cy,r,size,fpm){
  const a=angleForFpm(fpm);

  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(a);

  // shadow
  ctx.shadowColor='rgba(0,0,0,.55)';
  ctx.shadowBlur=size*.008;
  ctx.shadowOffsetX=size*.006;
  ctx.shadowOffsetY=size*.006;

  // tapered white needle
  ctx.fillStyle='#f0f0ec';
  ctx.beginPath();
  ctx.moveTo(-size*.035,-size*.012);
  ctx.lineTo(r*.76,-size*.010);
  ctx.lineTo(r*.86,0);
  ctx.lineTo(r*.76,size*.010);
  ctx.lineTo(-size*.035,size*.012);
  ctx.closePath();
  ctx.fill();

  ctx.shadowColor='transparent';

  // black edge
  ctx.strokeStyle='rgba(20,20,20,.55)';
  ctx.lineWidth=size*.002;
  ctx.stroke();

  ctx.restore();

  // center hub
  const hub=ctx.createRadialGradient(cx-size*.008,cy-size*.008,size*.004,cx,cy,size*.035);
  hub.addColorStop(0,'#4f5151');
  hub.addColorStop(.5,'#202223');
  hub.addColorStop(1,'#080909');
  ctx.fillStyle=hub;
  ctx.beginPath();
  ctx.arc(cx,cy,size*.034,0,Math.PI*2);
  ctx.fill();

  ctx.strokeStyle='#060707';
  ctx.lineWidth=size*.004;
  ctx.stroke();
}

function draw(){
  const {ctx,w,h}=fitCanvas(canvas);
  ctx.clearRect(0,0,w,h);

  const size=Math.min(w,h);
  const cx=w/2;
  const cy=h/2;

  ctx.fillStyle='#111416';
  ctx.fillRect(0,0,w,h);

  drawHousing(ctx,cx,cy,size);
  const bezel=drawBezel(ctx,cx,cy,size);
  const dialR=drawDial(ctx,cx,cy,size,bezel.inner);
  drawNeedle(ctx,cx,cy,dialR,size,state.fpm);
}

window.addEventListener('resize',draw);

let t0=performance.now();
function animate(ts){
  state.fpm += (state.targetFpm - state.fpm) * 0.12;
  draw();
  requestAnimationFrame(animate);
}

draw();
requestAnimationFrame(animate);

})();

    ctx.lineWidth=.45+seed(i*7.9)*.8;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);
    ctx.lineTo(cx+Math.cos(a)*r2,cy+Math.sin(a)*r2);
    ctx.stroke();
  }
  ctx.restore();

  ctx.strokeStyle='rgba(0,0,0,.85)';
  ctx.lineWidth=size*.010;
  ctx.beginPath();ctx.arc(cx,cy,inner,0,Math.PI*2);ctx.stroke();
  return inner;
}

function speedAngle(knots){
  // Reference-style scale:
  // 0 at lower-left, 900 at lower-right, sweeping clockwise across the top.
  const start = 135 * Math.PI/180;
  const sweep = 300 * Math.PI/180;
  const v=Math.max(0,Math.min(900,knots));
  return start + (v/900)*sweep;
}

function drawDial(ctx,cx,cy,size,innerR){
  const r=innerR*.94;

  const face=ctx.createRadialGradient(cx-size*.05,cy-size*.06,size*.02,cx,cy,r);
  face.addColorStop(0,'#25292a');
  face.addColorStop(.62,'#121516');
  face.addColorStop(1,'#080a0a');
  ctx.fillStyle=face;
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();

  // subtle aged face texture
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.clip();
  for(let i=0;i<1300;i++){
    const a=seed(i*5.2)*Math.PI*2;
    const rr=Math.sqrt(seed(i*2.8))*r;
    const x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;
    const al=.005+seed(i*8.5)*.012;
    ctx.fillStyle=seed(i*3.3)>.5?`rgba(255,255,220,${al})`:`rgba(0,0,0,${al})`;
    ctx.fillRect(x,y,size*.0012,size*.0012);
  }
  ctx.restore();

  const ink='#d7d69a';

  // 0..900, tick each 10 knots.
  ctx.save();
  ctx.translate(cx,cy);
  ctx.strokeStyle=ink;
  ctx.fillStyle=ink;
  ctx.textAlign='center';
  ctx.textBaseline='middle';

  for(let v=0;v<=900;v+=10){
    const a=speedAngle(v);
    const major=(v%100===0);
    const mid=(v%50===0);
    const ro=r*.91;
    const ri=major?r*.76:(mid?r*.79:r*.83);
    ctx.lineWidth=major?size*.0041:(mid?size*.0031:size*.0022);
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*ri,Math.sin(a)*ri);
    ctx.lineTo(Math.cos(a)*ro,Math.sin(a)*ro);
    ctx.stroke();
  }

  // numbers 0..900
  ctx.font=`bold ${Math.round(size*.038)}px Arial`;
  for(let v=0;v<=900;v+=100){
    const a=speedAngle(v);
    const rr=r*.64;
    ctx.fillText(String(v),
      Math.cos(a)*rr,
      Math.sin(a)*rr
    );
  }
  ctx.restore();

  // center wording
  ctx.fillStyle=ink;
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.font=`bold ${Math.round(size*.033)}px Arial`;
  ctx.fillText('GROUND',cx,cy+size*.075);
  ctx.fillText('SPEED',cx,cy+size*.111);
  ctx.fillText('KNOTS',cx,cy+size*.147);

  // small face screws/marks from the reference
  function faceDot(dx,dy,rr){
    const g=ctx.createRadialGradient(cx+dx-rr*.3,cy+dy-rr*.3,rr*.05,cx+dx,cy+dy,rr);
    g.addColorStop(0,'#454848');g.addColorStop(1,'#111313');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx+dx,cy+dy,rr,0,Math.PI*2);ctx.fill();
  }
  faceDot(0,-r*.55,size*.010);
  faceDot(-r*.55,r*.45,size*.008);
  faceDot(r*.52,r*.46,size*.008);

  // glass reflection
  const glass=ctx.createLinearGradient(cx-r,cy-r,cx+r,cy+r);
  glass.addColorStop(0,'rgba(255,255,255,.08)');
  glass.addColorStop(.20,'rgba(255,255,255,.025)');
  glass.addColorStop(.45,'rgba(255,255,255,0)');
  glass.addColorStop(1,'rgba(0,0,0,.07)');
  ctx.fillStyle=glass;
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();

  return r;
}

function drawNeedle(ctx,cx,cy,r,size,knots){
  const a=speedAngle(knots);
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(a);

  // black rear counterbalance
  ctx.fillStyle='#090b0c';
  ctx.beginPath();
  ctx.moveTo(-r*.35,-size*.008);
  ctx.lineTo(-size*.060,-size*.013);
  ctx.lineTo(-size*.060,size*.013);
  ctx.lineTo(-r*.35,size*.008);
  ctx.closePath();
  ctx.fill();

  // yellow/cream front needle like reference
  ctx.fillStyle='#d9d491';
  ctx.beginPath();
  ctx.moveTo(-size*.018,-size*.010);
  ctx.lineTo(r*.72,-size*.008);
  ctx.lineTo(r*.88,0);
  ctx.lineTo(r*.72,size*.008);
  ctx.lineTo(-size*.018,size*.010);
  ctx.closePath();
  ctx.fill();

  ctx.restore();

  // hub
  const hg=ctx.createRadialGradient(cx-size*.008,cy-size*.008,size*.004,cx,cy,size*.036);
  hg.addColorStop(0,'#555958');hg.addColorStop(.48,'#26292a');hg.addColorStop(1,'#0b0d0e');
  ctx.fillStyle=hg;
  ctx.beginPath();ctx.arc(cx,cy,size*.035,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#060707';ctx.lineWidth=size*.003;ctx.stroke();

  ctx.fillStyle='#5b4630';
  ctx.beginPath();ctx.arc(cx,cy,size*.008,0,Math.PI*2);ctx.fill();
}

function draw(){
  const {ctx,w,h}=fitCanvas(canvas);
  ctx.clearRect(0,0,w,h);
  const size=Math.min(w,h),cx=w/2,cy=h/2;
  ctx.fillStyle='#111416';ctx.fillRect(0,0,w,h);

  drawHousing(ctx,cx,cy,size);
  const inner=drawBezel(ctx,cx,cy,size);
  const r=drawDial(ctx,cx,cy,size,inner);

  state.knots += (state.targetKnots-state.knots)*0.16;
  drawNeedle(ctx,cx,cy,r,size,state.knots);

  if(state.gpsActive){
    statusEl.textContent=`GPS ground speed: ${Math.round(state.knots)} kt`;
  }else if(state.error){
    statusEl.textContent=state.error;
  }else{
    statusEl.textContent='Waiting for GPS speed…';
  }
}

function startGPS(){
  if(!navigator.geolocation){
    state.error='GPS/geolocation is not available in this browser.';
    return;
  }

  navigator.geolocation.watchPosition(
    pos=>{
      const mps=pos.coords.speed;
      state.accuracy=pos.coords.accuracy;
      state.lastFix=Date.now();

      if(typeof mps==='number' && Number.isFinite(mps) && mps>=0){
        state.targetKnots=mps*1.943844492;
        state.gpsActive=true;
        state.error='';
      }else{
        // Some browsers omit coords.speed while stationary / before a good fix.
        state.targetKnots=0;
        state.gpsActive=true;
        state.error='';
      }
    },
    err=>{
      state.gpsActive=false;
      state.error='GPS unavailable or permission denied.';
    },
    {
      enableHighAccuracy:true,
      maximumAge:500,
      timeout:15000
    }
  );
}

window.addEventListener('resize',draw);
// Native Android supplies GPS speed; browser geolocation is not started.

function animate(){
  draw();
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

})();
</script>

<script>
// Native Android -> instrument panel data entry point.
window.updateFlightData = function(data){
  if (!data) return;

  if (Number.isFinite(data.altitudeM) && window.setGpsAltitudeMeters) {
    window.setGpsAltitudeMeters(data.altitudeM);
  }
  if (Number.isFinite(data.speedKt) && window.setGroundSpeedKnots) {
    window.setGroundSpeedKnots(data.speedKt);
  }
  if (Number.isFinite(data.trackDeg) && window.setGpsHeading) {
    window.setGpsHeading(data.trackDeg);
  }
  if (Number.isFinite(data.vsiFpm) && window.setVerticalSpeedFpm) {
    window.setVerticalSpeedFpm(data.vsiFpm);
  }
  if (Number.isFinite(data.pitchDeg) && Number.isFinite(data.rollDeg) && window.setAttitude) {
    window.setAttitude(data.pitchDeg, data.rollDeg);
  }
};

window.nativeFlightDataReady = true;
</script>

<script>
// Sensor and GPS permissions are handled by native Android code.
</script>
